name: CI & Deployment Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript typecheck across workspaces
        run: npm run typecheck

  test:
    name: Unit & Integration Tests (Coverage Gates)
    runs-on: ubuntu-latest
    needs: validate
    services:
      mongo:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ping: 1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      MONGODB_URI: mongodb://127.0.0.1:27017/irrigiq_ci_test
      REDIS_URL: redis://127.0.0.1:6379
      JWT_SECRET: ci-testing-super-secret-jwt-key-min-32-chars-long
      CORS_ORIGIN: http://localhost:3000

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run test suite with Vitest coverage gates
        run: npm run test:coverage

  build-docker:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          tags: irrigiq-api:ci

      - name: Build Web Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          tags: irrigiq-web:ci

  e2e:
    name: Playwright End-to-End Tests
    runs-on: ubuntu-latest
    needs: [validate, test]
    services:
      mongo:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ping: 1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      MONGODB_URI: mongodb://127.0.0.1:27017/irrigiq_e2e_test
      REDIS_URL: redis://127.0.0.1:6379
      JWT_SECRET: ci-testing-super-secret-jwt-key-min-32-chars-long
      PORT: 4000
      VITE_API_URL: http://127.0.0.1:4000

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium with dependencies
        run: npx playwright install --with-deps chromium

      - name: Build all workspaces
        run: npm run build

      - name: Seed database with crops and sample fields
        run: npm run seed

      - name: Start API server in background
        run: |
          node apps/api/dist/index.js &
          npx wait-on http://127.0.0.1:4000/health -t 30000

      - name: Start Web preview server in background
        run: |
          npx vite preview --prefix apps/web --port 3000 --host 0.0.0.0 &
          npx wait-on http://127.0.0.1:3000 -t 30000

      - name: Run Playwright e2e test suite
        run: npm run e2e

  deploy:
    name: Production Deployment
    runs-on: ubuntu-latest
    needs: [validate, test, build-docker, e2e]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Trigger Render Deploy Hook (if configured)
        if: env.RENDER_DEPLOY_HOOK != ''
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          echo "Triggering Render API deployment..."
          curl -s -f -X POST "$RENDER_DEPLOY_HOOK"

      - name: Trigger Railway Deploy Hook (if configured)
        if: env.RAILWAY_DEPLOY_HOOK != ''
        env:
          RAILWAY_DEPLOY_HOOK: ${{ secrets.RAILWAY_DEPLOY_HOOK }}
        run: |
          echo "Triggering Railway deployment..."
          curl -s -f -X POST "$RAILWAY_DEPLOY_HOOK"

      - name: Trigger Vercel Deploy Hook (if configured)
        if: env.VERCEL_DEPLOY_HOOK != ''
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          echo "Triggering Vercel Web deployment..."
          curl -s -f -X POST "$VERCEL_DEPLOY_HOOK"

      - name: Deployment Completed Status
        run: |
          echo "🚀 Quality gates validated successfully. Production deployment triggered for commit ${{ github.sha }}."
