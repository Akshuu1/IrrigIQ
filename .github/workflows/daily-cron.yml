name: Daily Recommendations Cron Ping (05:00 AM IST)

on:
  schedule:
    # 05:00 AM IST is 23:30 UTC
    - cron: '30 23 * * *'
  workflow_dispatch:

jobs:
  ping-recommendations:
    name: Ping 05:00 IST Advisory Scheduler
    runs-on: ubuntu-latest
    steps:
      - name: Send Daily Recommendations Trigger Ping
        if: env.API_BASE_URL != ''
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          echo "Sending 05:00 AM IST trigger ping to $API_BASE_URL/scheduler/trigger-daily-recommendations..."
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST "$API_BASE_URL/scheduler/trigger-daily-recommendations" \
            -H "x-cron-secret: $CRON_SECRET" \
            -H "Content-Type: application/json")

          HTTP_STATUS=$(echo "$RESPONSE" | grep "HTTP_STATUS" | cut -d':' -f2)
          BODY=$(echo "$RESPONSE" | sed '/HTTP_STATUS/d')

          echo "Response Body: $BODY"
          echo "HTTP Status: $HTTP_STATUS"

          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "❌ Daily advisory trigger failed with HTTP status $HTTP_STATUS"
            exit 1
          fi

          echo "✅ Daily recommendations triggered successfully!"

